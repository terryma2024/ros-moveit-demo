[pytest]
# keep only the tmp_path directories of failed tests (human approval 2026-10-20); the retention count stays at its default
tmp_path_retention_policy = failed
# test/support holds the shared test helpers and the path constants (teleop_paths.py)
pythonpath =
    test/support
filterwarnings =
    ignore:`general_plain_validator_function` is deprecated.*:DeprecationWarning
