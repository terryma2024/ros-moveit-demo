backend: mujoco_py
owner_package: so101_demo_py
probe:
  package: so101_demo_py
  executable: teleop_workflow
  timeout_s: 10
  fixed_args: []
  scene_style: null
  session_style: null
camera_presets:
  - table_corner_nw
  - table_corner_ne
  - table_corner_se
  - table_corner_sw
  - top_down
capabilities:
  backend_probe: true
  workflow_execute: true
  workflow_start: false
  workflow_run: true
  workflow_resume: false
  workflow_stop: false
  reset_world: true
  scene_operations: false
  physical_observation: false
  manual_joint_execute: false
  manual_tcp_execute: false
  camera_presets: true
  task_batch: true
  task_reachability: true
  sensor_capture: true
  task_environment_shutdown: true
operations:
  workflow:
    package: so101_demo_py
    executable: teleop_workflow
    timeout_s: 300
    fixed_args: []
    scene_style: null
    session_style: null
  reset_world:
    package: so101_demo_py
    executable: teleop_reset
    timeout_s: 30
    fixed_args: []
    scene_style: null
    session_style: flag
  camera_preset:
    package: so101_demo_py
    executable: camera_preset
    timeout_s: 10
    fixed_args: []
    scene_style: null
    session_style: null
  task_batch:
    package: so101_demo_py
    executable: so101_mujoco_rgbd_batch
    timeout_s: 3600
    fixed_args: []
    scene_style: null
    session_style: null
  task_reachability:
    package: so101_demo_py
    executable: task_reachability
    timeout_s: 180
    fixed_args: []
    scene_style: null
    session_style: null
  sensor_capture:
    package: so101_demo_py
    executable: rgbd_sensor_capture
    timeout_s: 30
    fixed_args: []
    scene_style: null
    session_style: null
