backend: gazebo_cpp
owner_package: so101_gazebo_demo_cpp
probe:
  package: so101_gazebo_demo_cpp
  executable: pick_place_state_machine
  timeout_s: 10
  fixed_args: []
  scene_style: null
capabilities:
  backend_probe: true
  workflow_execute: true
  workflow_start: true
  workflow_run: true
  workflow_resume: true
  workflow_stop: false
  reset_world: true
  scene_operations: true
  physical_observation: true
  manual_joint_execute: true
  manual_tcp_execute: true
  camera_presets: true
operations:
  workflow:
    package: so101_gazebo_demo_cpp
    executable: pick_place_state_machine
    timeout_s: 120
    fixed_args: []
    scene_style: null
  reset_world:
    package: so101_gazebo_demo_cpp
    executable: reset_so101_world
    timeout_s: 120
    fixed_args: []
    scene_style: null
  scene:
    package: so101_gazebo_demo_cpp
    executable: so101_moveit_scene
    timeout_s: 20
    fixed_args: []
    scene_style: positional
