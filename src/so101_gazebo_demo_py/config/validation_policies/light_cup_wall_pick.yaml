  # adds up to roughly 0.5 mm of solver depth while remaining bilateral and
  # below the profile's 2 mm hard safety ceiling.
  max_penetration_m: 0.0013
  min_below_rim_m: 0.008
  max_below_rim_m: 0.035
  min_bottom_clearance_m: 0.020
  forbidden_collisions: [rim, bottom, wall_opposite]
