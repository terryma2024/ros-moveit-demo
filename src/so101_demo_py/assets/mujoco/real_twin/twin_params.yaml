    fx: 552.8310426445271
    fy: 552.3610398735387
    cx: 346.42473570930474      # OpenCV pixel convention (pixel centres at integers)
    cy: 259.7767775801493
    fovy_deg: 46.96974040332519                 # information only; the camera is built from fx, fy, cx, cy
    distortion_not_rendered: {k1: -0.5421335919953998, k2: 0.39973539850385026, p1: -0.003251710557572167, p2: 0.0006502250770171799, k3: -0.18330241796868593}   # OpenCV order k1 k2 p1 p2 k3; for the co-training step

