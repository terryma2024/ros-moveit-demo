  rows_y: [12.0, 16.0, 20.0, 24.0]
  row_names: [A, B, C, D]

bowl:                                           # human: outer top 12, inner top 10.5, height 4; a truncated cone
  center_plan_cm: [13.0, 18.0]
  outer_top_diameter: 12.0
  inner_top_diameter: 10.5
  height: 4.0
