# Parameters of the real-twin MuJoCo scene (the human's real SO-101 table, bed and room).
#
# Every dimension of scene_real_twin_cube_bowl.xml, so101_leader_visual.xml and so101_follower_twin.xml comes from this
# file (scripts/build_real_twin_scene.py regenerates the three XML files from it; a test checks that the committed XML
# files equal the regenerated ones).
#
# Units: lengths in cm, angles in degrees (rest pose) or radians where the key says so, masses in g. z values are
# heights above the floor. Plan coordinates (x, y) are those of the confirmed table plan: origin = follower
# shoulder_pan axis on the table surface, +x = the robot's left, +y = forward (the direction the arm points).
#
# Keys listed under `estimated` were not measured or given by the human. Each one says how it was estimated and is to be
# replaced by a measurement (see the report of the scene task).

schema: so101_real_twin_params
evidence_root: /data/work/so101-evidence/real-robot/prep-20261026   # plan: layout/placement-list.json, photos: photos/

frame:
  # plan (x, y, z) in cm -> sim world (x, y, z) in m
  plan_to_world: {x_world: "x_cm / 100", y_world: "-y_cm / 100", z_world: "z_cm / 100"}
  note: >-
    The sim robot faces world -y (as in every ACT scene), so plan +y (forward) is world -y and plan +x (the robot's
    left) is world +x. The follower pan axis is at world (0, 0). The table top is at world z = 0.75 m.
  follower_pan_axis_plan_cm: [0.0, 0.0]
  table_top_z_cm: 75.0

follower:
  source_file: assets/mujoco/act/so101_side_wrist.xml
  source_sha256: 9e0ec65cc0fbdddf35b7c4dd351696a70a1e77c19c0ebce086620c70c8c17e74
  # base frame offset of the shoulder_pan axis in the robot file (m), body "shoulder" pos x, y
  pan_axis_in_base_m: [0.0207909, -0.0230745]
  # base body z minus underside z in the robot file (m): the base underside is at base z + this value
  base_underside_above_origin_m: 0.0300814
  base_origin_z_in_source_m: 0.1899186
  white_rgba: [0.93, 0.93, 0.91, 1.0]          # the real follower is white; the source model is yellow
  base_footprint_cm: {rear_behind_axis: 6.98, front_ahead_of_axis: 2.58, half_width: 5.55}
  # static folded pose, LeRobot degrees of the follower rest pose measured 2026-10-26 (poses/folded-rest-20261026.txt, follower
  # column), applied as sim radians through the identity map and clamped to the sim joint range. Gripper is 0..100.
  rest_pose_deg: {pan: 4.8, lift: -104.8, elbow: 94.2, wrist_flex: 75.2, wrist_roll: -5.1, gripper: 13.0}
  sim_joint_ranges_rad:
    pan: [-1.91986, 1.91986]
    lift: [-1.74533, 1.74533]
    elbow: [-1.69, 1.69]
    wrist_flex: [-1.65806, 1.65806]
    wrist_roll: [-2.7438472969992493, 2.841206309382605]
    gripper: [-0.17453297762778586, 1.7453291995659765]

leader:
  # Official SO-101 leader model: so101_leader_new_calib.urdf of TheRobotStudio/SO-ARM100 (vendored in leader/, see
  # leader/SOURCE.md). Arm links are those of the follower; the gripper is a fixed handle plus a trigger joint.
  pan_axis_plan_cm: [41.9, 0.0]               # mirrored: follower axis is 6.0 + 5.55 cm from the right edge
  print_rgba: [0.13, 0.13, 0.14, 1.0]
  motor_rgba: [0.04, 0.04, 0.045, 1.0]
  urdf: leader/so101_leader_new_calib.urdf
  urdf_sha256: bc947e2fea65dfc91b0fc40e4cff0c01c6bf426687995937e62e2b0f41122db5
  # URDF base_link frame in the follower robot file's base frame: the pan axis and the base meshes coincide when the URDF
  # base_link is rotated by yaw_deg about z and moved by pos_m (derived from base_so101_v2 and the shoulder_pan origin)
  urdf_base_in_follower_base: {pos_m: [0.0207909, 0.0157608, 0.0324817], yaw_deg: -90.0}
  # meshes the URDF uses: file in the repository and its sha256 (equal to the upstream file). The first three are not in
  # the follower model and are vendored in leader/; the others are the follower's own files, reused.
  meshes:
    Handle_SO101: {file: leader/Handle_SO101.stl, sha256: a69b004691392cf0130b32ed9da5cc0c5fee49c2c8abee6ca27bf88e2a11347d}
    Trigger_SO101: {file: leader/Trigger_SO101.stl, sha256: 7122e0c476e69689eaf18441ecd36f5cf5cdca4d7033c15e5238a9b788e9d71a}
    Wrist_Roll_SO101: {file: leader/Wrist_Roll_SO101.stl, sha256: db20e6ac7c08cf8d75692a38db5a217011c97c0ab5d73c248296535df81e39b7}
    base_motor_holder_so101_v1: {file: ../assets/base_motor_holder_so101_v1.stl, sha256: 8cd2f241037ea377af1191fffe0dd9d9006beea6dcc48543660ed41647072424}
    base_so101_v2: {file: ../assets/base_so101_v2.stl, sha256: bb12b7026575e1f70ccc7240051f9d943553bf34e5128537de6cd86fae33924d}
    motor_holder_so101_base_v1: {file: ../assets/motor_holder_so101_base_v1.stl, sha256: 31242ae6fb59d8b15c66617b88ad8e9bded62d57c35d11c0c43a70d2f4caa95b}
    motor_holder_so101_wrist_v1: {file: ../assets/motor_holder_so101_wrist_v1.stl, sha256: 887f92e6013cb64ea3a1ab8675e92da1e0beacfd5e001f972523540545e08011}
    rotation_pitch_so101_v1: {file: ../assets/rotation_pitch_so101_v1.stl, sha256: 9be900cc2a2bf718102841ef82ef8d2873842427648092c8ed2ca1e2ef4ffa34}
    sts3215_03a_no_horn_v1: {file: ../assets/sts3215_03a_no_horn_v1.stl, sha256: 75ef3781b752e4065891aea855e34dc161a38a549549cd0970cedd07eae6f887}
    sts3215_03a_v1: {file: ../assets/sts3215_03a_v1.stl, sha256: a37c871fb502483ab96c256baf457d36f2e97afc9205313d9c5ab275ef941cd0}
    under_arm_so101_v1: {file: ../assets/under_arm_so101_v1.stl, sha256: d01d1f2de365651dcad9d6669e94ff87ff7652b5bb2d10752a66a456a86dbc71}
    upper_arm_so101_v1: {file: ../assets/upper_arm_so101_v1.stl, sha256: 475056e03a17e71919b82fd88ab9a0b898ab50164f2a7943652a6b2941bb2d4f}
    waveshare_mounting_plate_so101_v2: {file: ../assets/waveshare_mounting_plate_so101_v2.stl, sha256: e197e24005a07d01bbc06a8c42311664eaeda415bf859f68fa247884d0f1a6e9}
    wrist_roll_pitch_so101_v2: {file: ../assets/wrist_roll_pitch_so101_v2.stl, sha256: 6c7ec5525b4d8b9e397a30ab4bb0037156a5d5f38a4adf2c7d943d6c56eda5ae}
  # static folded pose: the leader column of poses/folded-rest-20261026.txt, LeRobot degrees, applied as radians through
  # the identity map and clamped to the URDF joint limits. The trigger (gripper, 0..100) maps linearly to the URDF
  # limit 0..45 degrees (positive opens); the URDF says this zero and range are provisional, so the mapping is too.
  rest_pose_deg: {pan: 4.9, lift: -104.2, elbow: 96.2, wrist_flex: 54.4, wrist_roll: -5.2, gripper: 13.7}

table:                                          # human: 65 x 45 cm, 30 cm high, on a bed of 45 cm
  x: [-11.55, 53.45]                            # right edge x = -11.55; plan: layout/placement-list.json
  y: [-6.98, 38.02]                             # back edge y = -6.98
  top_thickness: 2.5
  front_rim_depth: 4.0
  leg_size: 2.0
  leg_inset: 3.0
  top_rgba: [0.88, 0.78, 0.60, 1.0]
  rim_rgba: [0.93, 0.92, 0.88, 1.0]
  leg_rgba: [0.85, 0.85, 0.86, 1.0]
  friction: [0.8, 0.01, 0.001]

bed:                                            # human: 200 x 180 x 45 cm; headboard at the robot's right
  x: [-11.55, 188.45]                           # 200 cm from the headboard face, extending to the robot's left
  y: [-10.0, 170.0]                             # 180 cm wide
  z: [0.0, 45.0]
  cover_rgba: [0.78, 0.52, 0.52, 1.0]           # pink
cushion:                                        # headboard cushion, the table's right edge touches its front face
  x: [-23.55, -11.55]
  y: [-10.0, 170.0]
  z: [45.0, 97.0]
  rgba: [0.93, 0.88, 0.74, 1.0]
floor_rgba: [0.40, 0.23, 0.14, 1.0]
# Room walls (the back wall behind the desk and the wall behind the bed head). They are lit by emission, not by the lights, so
# shadows of the monitor and the desk do not change their brightness: every wall pixel is about the brightness of the wall
# next to the computer (human, 2026-10-27, measured as mean luma 112 of the 8-bit render in view_front before the change).
# rgba carries the white wall colour at a low level; emission adds `emission` times that colour.
wall:
  x: [-300.0, 300.0]
  y: [-110.0, -106.0]                           # behind the desk (back edge y = -102), not at y = -66 any more
  z: [0.0, 260.0]
  rgba: [0.0310, 0.0310, 0.0303, 1.0]
  emission: 13.8
bed_head_wall:                                  # the wall the bed head leans on, seen above the cushion in the left photo
  x: [-32.5, -28.5]
  y: [-110.0, 170.0]
  z: [0.0, 260.0]
curtain:
  x: [0.0, 170.0]
  y: [-105.5, -104.0]
  z: [20.0, 240.0]
  rgba: [0.78, 0.66, 0.66, 1.0]
radiator:
  x: [33.0, 76.0]
  y: [-104.0, -97.0]
  z: [12.0, 70.0]
  rgba: [0.94, 0.94, 0.94, 1.0]
# Computer desk, human 2026-10-27: 90 cm wide, 50 cm deep, 75 cm high (top surface 75 cm above the floor, level with the
# table top); the 90 cm side is parallel to the bed head (plan y), the 50 cm side runs along plan x. The monitor is parallel
# to the 90 cm side with its screen facing plan +x, towards the foot of the bed (human: 屏幕朝床尾方向), so the orientation
# of desk and monitor is measured. The xy position of the desk and the monitor is estimated from the photos.
desk:
  top: {x: [-28.0, 22.0], y: [-102.0, -12.0], z: [72.0, 75.0]}
  leg_size: 4.0
  drawer: {x: [-6.0, 22.0], y: [-60.0, -16.0], z: [61.0, 72.0]}   # drawer on the +x face, as in the left photo
  rgba: [0.78, 0.55, 0.30, 1.0]
monitor:                                        # panel plane parallel to y, screen towards +x (the bed's foot): measured
  panel: {x: [-22.5, -20.5], y: [-76.0, -20.0], z: [87.0, 120.0]}
  neck: {x: [-22.0, -21.0], y: [-49.5, -46.5], z: [76.0, 87.0]}
  foot: {x: [-27.0, -11.0], y: [-54.0, -42.0], z: [75.0, 76.0]}
  rgba: [0.05, 0.05, 0.06, 1.0]
lamp:
  center: [-10.0, -22.0]
  radius: 8.0
  z: [75.0, 95.0]
  rgba: [1.0, 0.84, 0.82, 1.0]

camera_stand:                                   # human: base diameter 16.5 cm, flush in the front-left corner
  base: {center: [45.2, 29.77], diameter: 16.5, height: 3.0}
  pole_radius: 0.9
  arm_points_cm:                                # polyline of the arm: base, elbow, boom end above the camera
    - [45.2, 29.77, 78.0]
    - [40.0, 29.0, 118.0]
    - [28.0, 28.5, 124.0]
  rgba: [0.06, 0.06, 0.07, 1.0]

side_camera:                                    # measured (calibrated 2026-10-27)
  status: measured (calibrated 2026-10-27)
  source:
    extrinsics_file: /data/work/so101-evidence/real-robot/calib-20261027/extrinsics-side.json
    extrinsics_sha256: 716276ec8d9fcb3b184778f2316232253a19891438389535448c09348305431a
    intrinsics_file: /data/work/so101-evidence/real-robot/calib-20261027/intrinsics-side.json
    intrinsics_sha256: dc86f83984bd847b1a3f35ea586d2fb87b4b2f239a52f6bd1131771a2a4a5dbf
    method: solvePnP of an ArUco sheet on the placement mat, 5 frames; extrinsics reprojection about 1 px
  # pose in the plan frame (cm; z above the table top): position is the mean of the 5 frames, forward is the file value,
  # image_up is the mean of the per-frame values made orthogonal to forward
  position_plan_cm: [31.08293320884991, 27.850871942429883, 32.48395000106226]
  forward_plan: [-0.7080131780868003, -0.1426436133275368, -0.6916430721349655]
  image_up_plan: [-0.6683278652856505, -0.18107606643626062, 0.7214910412795826]
  intrinsics:
    model: standard
    rms_px: 0.5786032884179276
    views_used: 25
    resolution: [640, 480]
    fx: 412.3338078934652
    fy: 411.94066050695005
    cx: 316.9157988862453      # OpenCV pixel convention (pixel centres at integers)
    cy: 245.1129957314437
    fovy_deg: 60.450855649108924                 # information only; the camera is built from fx, fy, cx, cy
    distortion_not_rendered: {k1: -0.357856253327659, k2: 0.18121566226789496, p1: 0.0012202799306712077, p2: 0.000485655026593806, k3: -0.052051153072295464}   # OpenCV order k1 k2 p1 p2 k3; for the co-training step
  body_half_size_cm: [3.5, 1.7, 1.75]

