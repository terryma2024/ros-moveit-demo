  headlight_diffuse: 0.12
  key: {pos_plan_cm: [10.0, 20.0, 230.0], diffuse: 0.50}
  fill: {dir: [0.4, 0.3, -0.8], diffuse: 0.14}

physics:
  timestep: 0.002
  integrator: implicitfast
  noslip_iterations: 10
  statistic_extent: 0.9045333128287155          # same near plane as the existing indoor scene (wrist camera clip)

estimated:
  follower.base_footprint_cm: not measured; read from the sim base meshes (the confirmed plan uses the same numbers)
  follower.white_rgba: colour of the real follower read from the photos
  follower.rest_pose_deg: LeRobot degrees are mapped to sim radians by identity and clamped (the joint map is not calibrated)
  leader.rest_pose_deg: measured leader readings, mapped by identity and clamped; the trigger maps 0..100 linearly onto the URDF's provisional 0..45 degrees (the joint map is not calibrated)
  leader.print_rgba: black plastic read from the photos
  table.top_thickness: 2.5 cm, edge of the real table top seen in the photos
  table.front_rim_depth: 4 cm white front rim, seen in the front photo
  table.leg_size: thin foldable aluminium legs, simplified to 4 boxes (visual only effect)
  table.top_rgba: light beige read from the close-up photo
  bed.y: the bed's back edge 3 cm behind the table back edge (photo, left view); the 180 cm width runs along y
  cushion: 12 cm thick, 52 cm above the mattress (photo, left view; the top is about 22 cm above the table top)
  desk.top.x: the desk's +x end at x = 22 and its 50 cm depth towards the bed-head wall (front and left photos); the size 90 x 50 x 75 is measured
  desk.top.y: front edge 5 cm behind the bed edge (y = -12), 90 cm towards the back wall (front and left photos); the size is measured
  desk.drawer: a drawer on the +x face under the top, position and size by eye (left photo)
  monitor: 56 x 33 cm panel (front photo); its orientation (parallel to the desk's 90 cm side, screen facing +x) is measured; its y range is read from the left photo (near edge about 15 cm behind the table back edge); neck and foot sizes by eye
  lamp: pink-white cylinder, radius 8 cm, on the desk between the table and the monitor (left photo)
  wall: back wall moved to y = -110 so that the 90 cm desk fits in front of it (the earlier y = -66 predates the measured desk length)
  bed_head_wall: plane 5 cm behind the cushion back (x = -28.5), height and extent by eye (left photo)
  wall.emission: the wall is lit by emission so that it has the brightness of the wall next to the computer everywhere
  curtain: from x = 0 to the left, on the back wall (front photo), moved with the wall
  radiator: x 33 to 76 under the curtain (front photo), moved with the wall
  camera_stand.arm_points_cm: arm drawn as 2 capsules from the base to the camera; real arm is a spring parallelogram
  wrist_camera.pose: the mount pose on the jaw is the sim robot file's, not calibrated (the intrinsics are measured)
  side_camera.rendering: lens distortion is not rendered (recorded in side_camera.intrinsics.distortion_not_rendered)
  overview_cameras: positions chosen by eye to look like the human's photos, render check only
  cubes.mass_g: 6 g, a 2 cm wooden cube is 4 to 8 g
  cubes.friction: plausible wood on laminate
  bowl.outer_bottom_diameter: 7.5 cm, about 7 to 8 cm in the close-up photo
  bowl.floor_thickness: 0.4 cm paper
  bowl.rgba: beige paper colour read from the photos
  lighting: indoor daylight guess
