schema_version: 1
scene: assets/mujoco/scene.xml
calibration_status: UNCALIBRATED
source: Frozen Gazebo geometry/names with independent uncalibrated MuJoCo dynamics/contact inputs
simulation_seconds: 10.0
finite_state_required: true
stationary_table_required: true
stationary_cup_after_settle_required: true
stationary_robot_after_settle_required: true
robot_position_envelope_limit_rad: 0.001
robot_velocity_limit_rad_s: 0.01
initial_inputs:
  timestep_s: 0.002
  joint_damping: 0.05
  joint_armature: 0.01
  table_friction: [0.8, 0.01, 0.001]
  cup_friction: [0.7, 0.01, 0.001]
  cup_free_joint_damping: 1.0
