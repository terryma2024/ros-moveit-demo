controller_manager:
  ros__parameters:
    update_rate: 500
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    neck_controller:
      type: joint_trajectory_controller/JointTrajectoryController
joint_state_broadcaster:
  ros__parameters:
    update_rate: 100
arm_controller:
  ros__parameters:
    joints:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    open_loop_control: false
    interpolate_from_desired_state: true
    allow_integration_in_goal_trajectories: true
gripper_controller:
  ros__parameters:
    joints:
    - '6'
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    open_loop_control: false
    interpolate_from_desired_state: true
    allow_integration_in_goal_trajectories: true
neck_controller:
  ros__parameters:
    joints:
    - neck_yaw_joint
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    open_loop_control: false
