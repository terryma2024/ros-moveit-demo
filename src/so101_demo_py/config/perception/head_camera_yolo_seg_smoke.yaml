# Head Search head-camera dataset: the non-promotable smoke profile.
#
# The scene includes assets/mujoco/act/so101.xml, so it carries the SAME production head camera the
# geometry seal was measured from; only the multi-object table layout is dataset-specific. The seal
# digest below is the accepted production-camera seal: generation refuses to render without it, and
# refuses any seal other than this one.
mjcf_path: ../../assets/mujoco/act/head_search_scene.xml
camera_name: head_camera
image_width: 640
image_height: 480
dataset_contract: so101-head-search-yolo-seg-v1
split_counts:
  train: 32
  val: 8
  test: 8
seed_starts:
  train: 4300000
  val: 4400000
  test: 4500000
neck_yaw_rad:
  min_rad: -0.35
  max_rad: 0.35
geometry_seal:
  required: true
  accepted_seal_sha256: 8c20afb86ee5fc35eaf0fab6dec74eeaa2f40bd2b380f5cc63be8d347ed14892
# The head profile renders the sealed camera where the seal freezes it: the ordinary view's
# +/-15 mm camera-position jitter would move the production camera these images are collected
# from, so it is declared as exactly zero and the renderer is checked against the seal.
# The arm configuration the geometry seal was validated at (EXP-016/017's measured
# collision-free pose). The dataset renders from it, and the verifier refuses any sample
# whose recorded arm configuration differs.
arm_pose_rad: [-0.25, 0.0, 0.6, 0.8, 0.0, 0.8]
camera_jitter_m: [0.0, 0.0]

promotable: false
