# Head Search head-camera dataset: the production profile.
#
# The scene includes assets/mujoco/act/so101.xml, so it carries the SAME production head camera the
# geometry seal was measured from; only the multi-object table layout is dataset-specific. The seal
# digest below is the accepted production-camera seal: generation refuses to render without it, and
# refuses any seal other than this one.
mjcf_path: ../../assets/mujoco/act/head_search_scene.xml
camera_name: head_camera
image_width: 640
image_height: 480
# The image safety edge phase 6 of the formal calibration intersects the projected legal pick workspace
# with (design section 7.1, `vertical_bounds_px`), declared as a FRACTION of the shorter production image
# edge rather than as a pixel count so it survives a resolution change:
#   safety_margin_px = ceil(image_safety_margin_fraction * min(image_width, image_height))
#                 = ceil(0.25 * min(640, 480)) = ceil(120.0) = 120 px
# 0.25 is a policy value: one quarter of the shorter edge is reserved at the top and at the bottom, which
# leaves half the 480 px image height for the projection to land in. It is deliberately NOT derived from
# the promoted `values.vertical_bounds_px` of `head_search_runtime.json` - a margin defined by the bounds it
# constrains would be circular - and 0.25 is exactly representable in binary, so the ceiling is not
# perturbed by floating-point rounding. The calibration records this path, its sha256 and the derived
# integer, and refuses a fraction outside (0, 0.5] or one whose dimensions contradict the sealed camera.
image_safety_margin_fraction: 0.25
dataset_contract: so101-head-search-yolo-seg-v1
split_counts:
  train: 800
  val: 200
  test: 200
seed_starts:
  train: 4000000
  val: 4100000
  test: 4200000
neck_yaw_rad:
  min_rad: -0.35
  max_rad: 0.35
geometry_seal:
  required: true
  accepted_seal_sha256: 8c20afb86ee5fc35eaf0fab6dec74eeaa2f40bd2b380f5cc63be8d347ed14892
# The head profile renders the sealed camera where the seal freezes it: the ordinary view's
# +/-15 mm camera-position jitter would move the production camera these images are collected
# from, so it is declared as exactly zero and the renderer is checked against the seal.
# The arm configuration the geometry seal was validated at (EXP-016/017's measured
# collision-free pose). The dataset renders from it, and the verifier refuses any sample
# whose recorded arm configuration differs.
arm_pose_rad: [-0.25, 0.0, 0.6, 0.8, 0.0, 0.8]
camera_jitter_m: [0.0, 0.0]

promotable: true
