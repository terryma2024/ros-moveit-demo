schema_version: 2
kind: act_training
action:
  chunk_size: 10
  execution_prefix: 1
  temporal_ensembling: false
  tail_padding_mask: true
observation:
  cameras: [side, wrist]
  state_dim: 6
  action_dim: 6
normalization:
  split: train
  # floor for the per-dimension std (kept from the head+wrist configuration; the six arm joints all vary)
  std_floor: 0.01
# TRAIN-004: training-side-wrist.yaml (TRAIN-003) plus the human decisions of 2026-10-19: drop the interior idle start rows (option 1,
# keep the last 20 rows of every episode) and the accepted speed-ups (cuDNN autotune, backbone channels_last, torch.compile; the DataLoader
# prefetch thread is always on). Everything that decides what is learned and how long (steps, batch, rates, seed, workers, preprocessing,
# backbone) is the same as TRAIN-003.
training:
  steps: 60000
  # TRAIN-002 (plan item O7): the ACT reference rates, learning_rate for the transformer and learning_rate_backbone for the ResNet
  learning_rate: 1.0e-4
  learning_rate_backbone: 1.0e-5
  batch_size: 16
  # training-view sample selection. trim_leading_idle drops the chunk START rows before max(0, r* - lead_in_rows), where r* is the first row
  # whose max over the six arm joints of |action - state| (raw radians) exceeds idle_threshold_rad. The idle stretch after the reset is
  # the Teacher's perception and planning time; its start is unobservable. Rows stay available as action-window targets. Applied to the
  # train samples and to the validation subset alike. An episode that never exceeds the threshold is kept whole.
  # trim_interior_idle then also drops, from that first row on, every START row t whose whole next chunk is static, that is the max over the
  # next chunk_size actions and the six joints of |a[t+k] - s[t]| (raw radians) is below idle_threshold_rad (strictly), except the last
  # keep_tail_rows rows of the episode, which stay so the policy learns to hold at the end. Same rule for the validation subset.
  sample_selection:
    trim_leading_idle: true
    idle_threshold_rad: 0.005
    lead_in_rows: 10
    trim_interior_idle: true
    keep_tail_rows: 20
  # speed-ups (antzb profile 2026-10-19; none changes the data, the maths or the sampling order, but cuDNN/compile are not bit-identical)
  cudnn_benchmark: true
  channels_last: true
  compile: true
  # progress and validation. None of these changes the training maths, the seed or the sampling order.
  # one stdout line and one metrics.jsonl record (window means, learning rate, samples/s, ETA, DataLoader wait vs compute) every N steps
  log_interval_steps: 100
  # validation loss on a fixed evenly spaced subset of the validation split every M steps (and at the last step)
  validation_interval_steps: 2000
  validation_samples: 512
  # DataLoader worker processes of the training loader (an explicit argument to the trainer wins)
  num_workers: 16
  # ImageNet ResNet18 (torchvision ResNet18_Weights.IMAGENET1K_V1, https://download.pytorch.org/models/resnet18-f37072fd.pth); the file
  # is given to the trainer by path and is hash-verified, never downloaded. null = random initialisation.
  pretrained_backbone:
    name: ResNet18_Weights.IMAGENET1K_V1
    sha256: f37072fd47e89c5e827621c5baffa7500819f7896bbacec160b1a16c560e07ec
frozen:
  seed: 20260924
  # sha256 of adapters/act/lerobot.py preprocessing_for(side-wrist) (the D8 decode table of the rig and the image scaling). Quoted: an all-digit hash is a YAML integer
  preprocessing_sha256: "699033697cb45db1cbc2f081f8e9d714bab12770e37ec934a6899d60eaaa7c21"
