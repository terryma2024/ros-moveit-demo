# SO-101 ACT shared endpoint-pose acceptance policy.
#
# The proposal's rule for the cup task: success is answered by two poses - the start and the end - with
# empirically configurable tolerances, not by process-quality scores. Every value here is a development
# default, not a calibrated threshold; runs may override the file at start-up or between episodes, and each
# episode records the effective configuration and its hash.
kind: ACT_ENDPOINT_POSE_POLICY
schema_version: 1
rule_version: endpoint_pose_v1
thresholds:
  initial_position_tolerance_m: 0.010
  initial_axis_tolerance_rad: 0.15
  final_xy_tolerance_m: 0.020
  final_z_tolerance_m: 0.010
  final_axis_tolerance_rad: 0.15
