# SO-101 Teacher endpoint rule teacher_endpoint_v2.
#
# Task success is answered by one start pose and one end pose read from the executed world, against these
# empirical development tolerances. settle_s is the wait after the controller is confirmed stopped and before
# the single end snapshot. The file is frozen into the attempt inputs with its sha256 before the attempt.
kind: ACT_TEACHER_ENDPOINT_POLICY
schema_version: 1
rule_version: teacher_endpoint_v2
tolerances:
  initial_position_m: 0.010
  initial_axis_rad: 0.15
  final_xy_m: 0.020
  final_z_m: 0.010
  final_axis_rad: 0.15
  settle_s: 0.5
