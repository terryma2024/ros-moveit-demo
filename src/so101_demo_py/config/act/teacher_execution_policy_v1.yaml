# SO-101 Teacher execution policy: the Teacher's own state-freshness and deadline bounds. These are not the
# ACT 10 Hz / 100 ms data contract. The file is frozen with the attempt inputs.
kind: ACT_TEACHER_EXECUTION_POLICY
schema_version: 1
state_max_age_s: 0.5
state_unavailable_stop_s: 1.0
execution_deadline_s: 180.0
# The gripper close target (joint 6, rad) of the ACT Teacher's CLOSE_GRIPPER state. This is the grasp_close_q6 baseline
# the contact calibration (EXP-179 offline cohort, scripted position-actuator closes) was fitted under, the activated
# cup force/compression limits therefore describe a hold at this close; see config/mujoco/model-parity.yaml (grasp) and
# config/policies/light_cup_wall_pick/v1/mujoco.yaml (grasp_close_q6). The ordinary dynamic_cup_pick_place without frozen
# inputs keeps its own -0.0485 and never reads this value. Recorded Teacher design change (C3): it replaces the
# original qualified seating preload of -0.0485 for the ACT Teacher.
gripper_close_target_rad: -0.047608632840292
# MoveIt scaling of the carry (C6, a Teacher design change for one diagnostic; no safety threshold changes). The carry is
# the states that move the held cup after ATTACH_MOVEIT: LIFT (vertical, +0.06 m), MOVE_ABOVE_PLACE (the only state that
# moves the cup laterally, about 0.1 m and a yaw) and DESCEND_TO_PLACE (vertical). Run CP-3382 (C5 profile of CP-3381):
# with the gentler close the hold was 26% of both limits, yet compression ran away 0.2-0.3 s after the base-yaw ramp began
# (constant 0.19 rad/s^2, dq1 about 0.05 rad/s) and tripped at step 24818. This diagnostic quarters the acceleration
# scaling, which roughly halves the velocity reached over the same displacement; velocity stays capped as before.
# Used only with frozen inputs; the plain dynamic_cup_pick_place keeps the template's 0.03/0.03.
carry_max_velocity_scaling: 0.03
carry_max_acceleration_scaling: 0.0075
# Place descent offset (R11; ACT-only Teacher parameter, metres, negative = lower). The policy place TCP z (0.217634413,
# shared with main) puts the held cup's centre 15 mm above its rest height: the D5(a) run (CP-3395, run ba141ebd) stopped at
# release with DYNAMIC_RELEASE_SUPPORT_NOT_PROVED (no cup-table contact, cup 0.18002 m vs 0.165 m on the table). main drops the
# cup from that hover and has no support check; the ACT Teacher keeps support-before-open (cup-table contact, force > 0,
# distance <= 0.002 m, both fingertips) and lowers the DESCEND_TO_PLACE target for frozen inputs only. Value chosen by the offline
# replay writer-artifacts/r11-exp/place_descent.py on the aligned model (live carry joints, real actuators, held cup): the
# offline cup z at offset 0 is 0.18012 m (live 0.18002 m); support first becomes true at -12.75 mm (false at -12.5 mm); the
# smallest offset with >= 0.5 mm margin is -13.25 mm: supported, cup-table force 0.148 N at distance -0.19 mm, summed cup force
# 0.80 N (42% of the 1.89 N proxy limit; carry level before touchdown 1.53 N), compression 41% of 1.19e-4 m, tilt 3.5 deg,
# cup slip in the grasp 0.36 mm / 0.47 deg. Without frozen inputs the plain pick-place keeps the policy place z.
place_descend_offset_m: -0.01325
