[develop]
script_dir=$base/lib/so101_demo_py
[install]
install_scripts=$base/lib/so101_demo_py

[tool:pytest]
# the gate-runner test imports tools/ from the repository root, so the root is on sys.path for the package's own
# test run; test/support holds the shared test helpers and the path constants (paths.py); relative to this file,
# never an absolute machine path
pythonpath =
    ../..
    test/support
testpaths =
    test
addopts = -m "not explicit_ml"
# keep only the tmp_path directories of failed tests (human approval 2026-10-20); the retention count stays at its default
tmp_path_retention_policy = failed
markers =
    explicit_ml: opt-in Torch/SAM integration tests excluded from the ordinary full run
    fast: offline MuJoCo regressions that finish in seconds
